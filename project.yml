name: SKIBIDI
options:
  bundleIdPrefix: com.bpjsr
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: W742UG8KZT
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "SKIBIDI needs your location to show you on the map and share with your travel community."
    INFOPLIST_KEY_NSHealthShareUsageDescription: "SKIBIDI reads your health data to share wellness metrics with your travel community."
    INFOPLIST_KEY_NSHealthUpdateUsageDescription: "SKIBIDI writes health data to track your wellness activities."

targets:
  SKIBIDI:
    type: application
    platform: iOS
    sources:
      - path: SKIBIDI
      - path: Documentation
        buildPhase: none
    entitlements:
      path: SKIBIDI/SKIBIDI.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.bpjsr.skibidi
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bpjsr.skibidi
        INFOPLIST_KEY_CFBundleDisplayName: SKIBIDI
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: minimal
