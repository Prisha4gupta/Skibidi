name: SKIBIDI
options:
  bundleIdPrefix: com.bpjsr
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # DEVELOPMENT_TEAM is intentionally NOT set here — each developer supplies their own via a
    # local, gitignored Local.xcconfig (see configFiles below). This stops one person's team from
    # being forced on teammates, which breaks their signing. Copy Local.xcconfig.example to start.
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    # We provide an explicit Info.plist (below) instead of generating one, because CloudKit's
    # CKSharingSupported must be a real Boolean — the INFOPLIST_KEY_ generation path drops it.
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SKIBIDI:
    type: application
    platform: iOS
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    info:
      path: SKIBIDI/Info.plist
      properties:
        CFBundleDisplayName: SKIBIDI
        LSRequiresIPhoneOS: true
        # CKSharingSupported = true lets a tapped CloudKit share link open THIS app (required for
        # accepting invites). Must be a Boolean, which is why we hand-author the plist.
        CKSharingSupported: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "SKIBIDI needs your location to show you on the map and share with your travel community."
        NSLocationAlwaysAndWhenInUseUsageDescription: "SKIBIDI keeps your community updated on your whereabouts while you're moving."
        NSHealthShareUsageDescription: "SKIBIDI reads your health data to share wellness metrics with your travel community."
        NSHealthUpdateUsageDescription: "SKIBIDI writes health data to track your wellness activities."
    sources:
      - path: SKIBIDI
      - path: Documentation
        buildPhase: none
    entitlements:
      path: SKIBIDI/SKIBIDI.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.bpjsr.skibidi
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bpjsr.skibidi
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: minimal
